apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
  namespace: backstage
spec:
  interval: 10m
  chart:
    spec:
      chart: backstage
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: backstage
        namespace: backstage
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    backstage:
      image:
        registry: ghcr.io
        repository: t12-pybash/backstage
        tag: "latest@sha256:ee9b3b6c1f7e891385409ce8715b2a8dcb8fbad0703dd695ec921a94e2e2e6ad"
        pullPolicy: Always
      appConfig:
        app:
          title: T-12 Platform
          baseUrl: https://backstage.home.t12.io
        backend:
          baseUrl: https://backstage.home.t12.io
          listen:
            port: 7007
          cors:
            origin: https://backstage.home.t12.io
          database:
            client: better-sqlite3
            connection:
              directory: /tmp/backstage-sqlite
        auth:
          environment: development
          providers:
            guest:
              dangerouslyAllowOutsideDevelopment: true
            github:
              development:
                clientId: ${GITHUB_CLIENT_ID}
                clientSecret: ${GITHUB_CLIENT_SECRET}
        kubernetes:
          serviceLocatorMethod:
            type: multiTenant
          clusterLocatorMethods:
            - type: config
              clusters:
                - url: https://kubernetes.default.svc.cluster.local
                  name: homelab
                  authProvider: serviceAccount
                  skipTLSVerify: true
                  skipMetricsLookup: true
        techdocs:
          builder: local
          generator:
            runIn: local
          publisher:
            type: local
        integrations:
          github:
            - host: github.com
              token: ${GITHUB_TOKEN}
        proxy:
          endpoints:
            /github/api:
              target: https://api.github.com
              allowedHeaders:
                - Authorization
                - X-GitHub-Api-Version
              headers:
                Authorization: Bearer ${GITHUB_TOKEN}
                User-Agent: backstage
        catalog:
          rules:
            - allow: [Component, System, API, Resource, Location, Group, User]
          locations:
            - type: url
              target: https://github.com/t12-pybash/clever-cloud-3tier/blob/main/catalog-info.yaml
      extraEnvVars:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-github-token
              key: GITHUB_TOKEN
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-github-token
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-github-token
              key: GITHUB_CLIENT_SECRET
    service:
      type: ClusterIP
    ingress:
      enabled: false
