apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ai-platform
spec:
  interval: 10m
  chart:
    spec:
      chart: ./helm/litellm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/berriai/litellm
      tag: main-latest@sha256:4870893763aca143f590bd5685a25219037af027d1d27e97abcb17ac9ec5d09f
    service:
      type: ClusterIP
      port: 4000
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    livenessProbe:
      tcpSocket:
        port: 4000
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      tcpSocket:
        port: 4000
      initialDelaySeconds: 45
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    env:
      - name: LITELLM_LOG
        value: INFO
      - name: LITELLM_CONFIG_PATH
        value: /app/config/config.yaml
    config:
      model_list:
        - model_name: llama3.1:8b
          litellm_params:
            model: ollama/llama3.1:8b
            api_base: http://ollama.ai-platform.svc.cluster.local:11434
        - model_name: phi4-mini
          litellm_params:
            model: ollama/phi4-mini
            api_base: http://ollama.ai-platform.svc.cluster.local:11434
        - model_name: deepseek-r1:7b
          litellm_params:
            model: ollama/deepseek-r1:7b
            api_base: http://ollama.ai-platform.svc.cluster.local:11434
        - model_name: qwen2.5-coder:7b
          litellm_params:
            model: ollama/qwen2.5-coder:7b
            api_base: http://ollama.ai-platform.svc.cluster.local:11434
        - model_name: mistral-nemo
          litellm_params:
            model: ollama/mistral-nemo
            api_base: http://ollama.ai-platform.svc.cluster.local:11434
      router_settings:
        enable_pre_call_checks: true
        enable_cooldowns: true
      cache:
        type: redis
        host: redis-master.redis.svc.cluster.local
        port: 6379
        namespace: litellm_caching