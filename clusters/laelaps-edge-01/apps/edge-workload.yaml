---
apiVersion: v1
kind: Namespace
metadata:
  name: edge-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-agent
  namespace: edge-apps
  labels:
    app: edge-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-agent
  template:
    metadata:
      labels:
        app: edge-agent
    spec:
      containers:
        - name: edge-agent
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
