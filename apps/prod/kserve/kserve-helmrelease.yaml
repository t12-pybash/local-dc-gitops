apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve
  namespace: kserve
spec:
  interval: 30m
  dependsOn:
    - name: kserve-crd
      namespace: kserve
  chart:
    spec:
      chart: kserve
      version: "v0.13.*"
      sourceRef:
        kind: HelmRepository
        name: kserve
        namespace: kserve
  values:
    kserve:
      modelmesh:
        enabled: false
