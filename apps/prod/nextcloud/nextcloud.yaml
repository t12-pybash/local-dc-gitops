apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 250Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: go-vod
          image: radialapps/go-vod@sha256:40a3a557eaf0a156142bd07396f0ff4023346410dc0490b4d30741fe4945de40
          ports:
            - containerPort: 47788
          env:
            - name: NEXTCLOUD_HOST
              value: http://localhost
            - name: NEXTCLOUD_ALLOW_INSECURE
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/www/html
        - name: nextcloud
          image: nextcloud:29.0.16-apache@sha256:fdd160489f15f07aa6e352d8c628bf09c945d5199e9fa27eaf104b04177beaf6
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: postgres.nextcloud.svc.cluster.local
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: POSTGRES_PASSWORD
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "nextcloud.home.t12.io nextcloud.t-12.io"
            - name: REDIS_HOST
              value: redis.nextcloud.svc.cluster.local
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.home.t12.io
            - name: TRUSTED_PROXIES
              value: 10.244.0.0/16
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: php-security
              mountPath: /usr/local/etc/php/conf.d/security.ini
              subPath: security.ini
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
        - name: php-security
          configMap:
            name: nextcloud-php-security
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-php-security
  namespace: nextcloud
data:
  security.ini: |
    session.upload_progress.enabled=Off
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  selector:
    app: nextcloud
  ports:
    - port: 80
      targetPort: 80
