apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/note: "Stable DNS name for Ollama — routes to KServe predictor pod"
spec:
  selector:
    serving.kserve.io/inferenceservice: ollama
    component: predictor
  ports:
    - port: {{ .Values.ollama.service.port }}
      targetPort: {{ .Values.ollama.service.port }}
