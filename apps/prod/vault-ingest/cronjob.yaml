apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-ingest
  namespace: vault-ingest
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: publish
              image: ghcr.io/t12-pybash/argus@sha256:f18bc2c5cbedd3b55690f0ca77671b409c5f2a897d796b9c94adb505afc92a87
              imagePullPolicy: Always
              command: ["python", "-m", "argus.scripts.vault_git_publisher"]
              env:
                - name: ARGUS_CONFIG_FILE
                  value: /etc/argus/config.toml
              volumeMounts:
                - name: vault-data
                  mountPath: /vault
                - name: ssh-key
                  mountPath: /ssh
                  readOnly: true
                - name: argus-config
                  mountPath: /etc/argus
                - name: ingest-cache
                  mountPath: /root/.config/argus
          volumes:
            - name: vault-data
              persistentVolumeClaim:
                claimName: vault-data
            - name: ssh-key
              secret:
                secretName: vault-ingest-ssh
                defaultMode: 0400
            - name: argus-config
              configMap:
                name: argus-config
            - name: ingest-cache
              persistentVolumeClaim:
                claimName: vault-ingest-cache
