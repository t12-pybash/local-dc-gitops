apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy@sha256:141884edc6450a3dd5f25acec054fa8699b444e08ec131962c564def0cbfc1ba
          args: ["serve"]
          ports:
            - containerPort: 80
          env:
            - name: NTFY_BASE_URL
              value: https://ntfy.home.t12.io
            - name: NTFY_ATTACHMENT_CACHE_DIR
              value: /var/cache/ntfy/attachments
            - name: NTFY_ATTACHMENT_TOTAL_CACHE_SIZE
              value: 1G
            - name: NTFY_ATTACHMENT_FILE_SIZE_LIMIT
              value: 15m
          volumeMounts:
            - name: attachment-cache
              mountPath: /var/cache/ntfy/attachments
      volumes:
        - name: attachment-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: monitoring
spec:
  selector:
    app: ntfy
  ports:
    - port: 80
      targetPort: 80
