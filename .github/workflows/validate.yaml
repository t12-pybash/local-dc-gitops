name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint -c .yamllint.yaml .

  validate-kustomize:
    name: Kustomize Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"
      - name: Build all kustomizations
        run: |
          FAILED=0
          for dir in $(find . -name 'kustomization.yaml' | grep -v '.git' | xargs -I{} dirname {}); do
            echo "Building $dir..."
            if ! kustomize build "$dir" > /dev/null 2>&1; then
              echo "FAILED: $dir"
              FAILED=1
            fi
          done
          exit $FAILED

  check-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          FAILED=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|revert)(\(.+\))?!?: .+'; then
              echo "Invalid commit: $msg"
              FAILED=1
            fi
          done < <(git log --no-merges --format='%s' origin/${{ github.base_ref }}..HEAD)
          exit $FAILED
