apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.1
          args:
            - --source=gateway-httproute
            - --provider=rfc2136
            - --rfc2136-host=technitium-dns.dns.svc.cluster.local
            - --rfc2136-port=53
            - --rfc2136-zone=home.t12.io
            - --rfc2136-tsig-keyname=external-dns
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --domain-filter=home.t12.io
            - --policy=upsert-only
            - --txt-owner-id=external-dns-homelab
            - --interval=1m
            - --log-level=info
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: external-dns-secrets
                  key: tsig-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
