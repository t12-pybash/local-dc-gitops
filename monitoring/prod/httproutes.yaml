---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gw
      namespace: kube-system
  hostnames:
    - "grafana.home.t12.io"
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
