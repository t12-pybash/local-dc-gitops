apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: ai-platform
spec:
  interval: 10m
  chart:
    spec:
      chart: ./helm/open-webui
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: latest@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0
    service:
      type: ClusterIP
      port: 3000
      targetPort: 8080
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    persistence:
      enabled: true
      storageClass: "local-path"
      size: 5Gi
    env:
      - name: OLLAMA_BASE_URL
        value: "http://ollama.ai-platform.svc.cluster.local:11434"
      - name: OLLAMA_API_BASE_URL
        value: "http://ollama.ai-platform.svc.cluster.local:11434/api"
      - name: OPENAI_API_BASE_URL
        value: "http://litellm.ai-platform.svc.cluster.local:4000"
      - name: OPENAI_API_KEY
        value: "sk-ollama"
