---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: ai-platform
spec:
  parentRefs:
    - name: homelab-gw
      namespace: kube-system
  hostnames:
    - "open-webui.home.t12.io"
  rules:
    - backendRefs:
        - name: open-webui
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: ai-platform
spec:
  parentRefs:
    - name: homelab-gw
      namespace: kube-system
  hostnames:
    - "litellm.home.t12.io"
  rules:
    - timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: litellm
          port: 4000
