apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: n8n
spec:
  parentRefs:
    - name: homelab-gw
      namespace: kube-system
  hostnames:
    - "n8n.home.t12.io"
  rules:
    - timeouts:
        request: 3600s
        backendRequest: 3600s
      backendRefs:
        - name: n8n
          port: 5678
