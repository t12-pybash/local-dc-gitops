apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: homelab-gw
      namespace: kube-system
  hostnames:
    - "nextcloud.home.t12.io"
  rules:
    - timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: nextcloud
          port: 80
