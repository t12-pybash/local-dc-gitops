ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: "10.244.0.0/16"
    clusterPoolIPv4MaskSize: 24

kubeProxyReplacement: true

tunnelProtocol: vxlan

l2announcements:
  enabled: true

externalIPs:
  enabled: true

devices: "enp+,br0,tailscale+"

k8sServiceHost: "<control-plane-ip>"
k8sServicePort: 6443

operator:
  replicas: 1
