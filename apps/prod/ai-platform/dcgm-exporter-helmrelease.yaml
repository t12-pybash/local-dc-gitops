apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
  namespace: ai-platform
spec:
  interval: 10m
  chart:
    spec:
      chart: dcgm-exporter
      version: "3.4.0"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: ai-platform
      interval: 10m
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    # Only run on GPU nodes
    nodeSelector:
      gpu: "true"

    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    # Prometheus ServiceMonitor — labels must match kube-prometheus-stack selector
    serviceMonitor:
      enabled: true
      interval: 15s
      additionalLabels:
        release: kube-prometheus-stack

    # Consumer GPU (GTX 1070) — NVML mode, no full DCGM required
    # Metrics: GPU util, VRAM used/free, temperature, power, memory bandwidth
    arguments:
      - -f
      - /etc/dcgm-exporter/default-counters.csv

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    securityContext:
      privileged: true
      runAsNonRoot: false
      runAsUser: 0
