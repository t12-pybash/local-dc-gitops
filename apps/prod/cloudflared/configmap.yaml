apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: bcd07425-9da1-4ded-925e-8d1f51bc9caf
    credentials-file: /etc/cloudflared/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: grafana.t-12.io
        service: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
      - hostname: nextcloud.t-12.io                          # ADD THIS
        service: http://nextcloud.nextcloud.svc.cluster.local:80  # AND THIS
      - service: http_status:404
