replicaCount: 1

image:
  repository: ghcr.io/open-webui/open-webui
  tag: v0.9.5@sha256:e045bde3b004cc7f8c319412345eb56c87ea6ac57031534a31ca37ad5424beb3
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 3000
  targetPort: 8080
  nodePort: 30080

ingress:
  enabled: false

# Connection to Ollama inference server
env:
  - name: OLLAMA_BASE_URL
    value: "http://ollama.ai-platform.svc.cluster.local:11434"
  - name: OLLAMA_API_BASE_URL
    value: "http://ollama.ai-platform.svc.cluster.local:11434/api"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeSelector: {}

tolerations: []

affinity: {}
