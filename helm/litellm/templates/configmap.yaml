apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: litellm
data:
  config.yaml: |
    model_list:
{{ toYaml .Values.config.model_list | indent 6 }}

    router_settings:
{{ toYaml .Values.config.router_settings | indent 6 }}

    litellm_settings:
      callbacks: ["prometheus"]
{{- if .Values.config.cache }}
      cache: true
      cache_params:
{{ toYaml .Values.config.cache | indent 8 }}
{{- end }}
