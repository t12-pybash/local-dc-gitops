# GitLab CI/CD Pipeline for Flux GitOps
# Ensures no secrets leak, validates manifests, enforces conventional commits

stages:
  - validate
  - security
  - review
  - deploy
  - renovate

variables:
  HELM_CHARTS_VERSION: "1.0.0"

# Detect secrets before anything
detect-secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --exit-code 1
  allow_failure: false
  only:
    - merge_requests
    - main

# Prevent commits with sensitive data
pre-commit-security:
  stage: security
  image: python:3.11
  before_script:
    - pip install detect-secrets
  script:
    - detect-secrets scan --exclude-files '\.secrets\.baseline' . > /tmp/current-scan.json
    - python3 ci/check-secrets.py
  allow_failure: false
  only:
    - merge_requests
    - main

# Validate SOPS encryption (encrypted files only)
validate-sops:
  stage: validate
  image: mozilla/sops:latest
  script:
    - |
      echo "Checking for unencrypted secrets..."
      # Fail only if password: or token: values are NOT already SOPS-encrypted
      UNENCRYPTED=$(grep -rh "password:\|token:" . \
        --include="*.yaml" \
        --include="*.yml" \
        --exclude=".gitlab-ci.yml" \
        2>/dev/null \
        | grep -v "ENC\[" \
        | grep -v "^\s*#" \
        | grep -v '\${' \
        || true)
      if [ -n "$UNENCRYPTED" ]; then
        echo "❌ Found potentially unencrypted secret values:"
        echo "$UNENCRYPTED"
        exit 1
      fi
      echo "✅ No unencrypted secrets found"
  allow_failure: false
  only:
    - merge_requests
    - main

# Validate YAML syntax
yaml-validate:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add yamllint
  script:
    - |
      yamllint -d '{rules: {line-length: {max: 300}}}' $(find . -name '*.yaml' -o -name '*.yml' | grep -v '\.sops\.yaml' | grep -v '/helm/' | grep -v 'k8s-resources-cluster-fixed.yaml')
  allow_failure: false
  only:
    - merge_requests
    - main

# Validate Kubernetes manifests
kubeval-validate:
  stage: validate
  image:
    name: ghcr.io/yannh/kubeconform:latest-alpine
    entrypoint: [""]
  script:
    - |
      find . -name '*.yaml' -o -name '*.yml' \
        | grep -v '.git' | grep -v '.sops.' | grep -v 'kustomization.y' \
        | xargs -r kubeconform -ignore-missing-schemas -skip HelmRelease,HelmRepository,Kustomization,GitRepository,HelmChart,CiliumNetworkPolicy,CiliumL2AnnouncementPolicy,CiliumLoadBalancerIPPool,HTTPRoute,Gateway,GatewayClass,Certificate,ClusterIssuer,InferenceService \
        && echo "✅ kubeconform passed" || echo "⚠ some schemas skipped"
  allow_failure: true
  only:
    - merge_requests
    - main

# Validate Kustomizations can build
kustomize-validate:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add curl
    - curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin/
  script:
    - |
      ROOT=$(pwd)
      for kustomization in $(find . -name 'kustomization.yaml' -o -name 'kustomization.yml'); do
        dir=$(dirname "$kustomization")
        echo "Building $dir..."
        (cd "$ROOT/$dir" && kustomize build . > /dev/null) || { echo "Failed: $dir"; exit 1; }
      done
  allow_failure: false
  only:
    - merge_requests
    - main

# Validate Helm charts referenced in HelmReleases
helm-validate:
  stage: validate
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  script:
    - |
      echo "Scanning for HelmReleases..."
      if command -v helm &> /dev/null; then
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add nextcloud https://nextcloud.github.io/helm/
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        echo "✅ Helm repos available"
      fi
  allow_failure: true
  only:
    - merge_requests
    - main

# Check for large files
check-large-files:
  stage: validate
  image: alpine:latest
  script:
    - |
      find . -size +1M -type f \
        ! -path './.git/*' \
        ! -path './.gitlab/*' && echo "❌ Large files found" && exit 1 || true
      echo "✅ No large files"
  allow_failure: false
  only:
    - merge_requests
    - main

# Verify commit messages
commit-lint:
  stage: validate
  image: node:18-alpine
  before_script:
    - apk add --no-cache git
  script:
    - |
      COMMIT_MSG=$(git log -1 --pretty=%B)
      echo "Checking commit: $COMMIT_MSG"
      if ! echo "$COMMIT_MSG" | grep -E '^(feat|fix|docs|style|refactor|perf|test|chore|ci|revert)(\(.+\))?!?: .+'; then
        echo "❌ Commit message does not follow conventional commits"
        echo "Expected format: <type>(<scope>): <subject>"
        exit 1
      fi
  only:
    - merge_requests
    - main

# Flux validation — check clusters/prod kustomize builds cleanly
flux-validate:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin/
  script:
    - |
      for dir in clusters/prod; do
        echo "Building $dir..."
        kustomize build "$dir" > /dev/null && echo "✅ $dir" || echo "❌ $dir"
      done
  allow_failure: true
  only:
    - merge_requests
    - main

# LLM-powered MR review — posts AI review as MR comment
llm-review:
  stage: review
  image: python:3.11-slim
  tags:
    - homelab-k8s
  script:
    - python3 ci/llm-review.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  timeout: 3 minutes

# Flux sync on main branch only
flux-sync:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    action: start
  script:
    - echo "Flux will auto-sync from this repo"
    - echo "Changes deployed via GitOps"
  only:
    - main
  when: on_success

# Renovate dependency updates (runs on schedule only)
renovate:
  stage: renovate
  image: renovate/renovate:slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.com/api/v4
    RENOVATE_GIT_AUTHOR: "Renovate Bot <bot@renovateapp.com>"
    RENOVATE_AUTODISCOVER: "false"
    LOG_LEVEL: info
  script:
    - renovate pybashinf-group/homelab-gitops
  allow_failure: false

# Notify of deployment
notify-gitops-deployment:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - echo "✅ GitOps deployment successful"
    - echo "Changes from commit $CI_COMMIT_SHORT_SHA are now syncing to cluster"
  only:
    - main
  allow_failure: true
